<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photo gallery of life at Rosete Junior School and Sarang Adonai Rosete Foundation Uganda.">
  <title>Gallery | Sarang Adonai Rosete Foundation Uganda</title>
  <link rel="icon" href="images/badge.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0a1931;--navy2:#13294b;--gold:#ffc947;--paper:#f5f7fb;--ink:#16233b;--muted:#6b7280;--line:#e5e9f0}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 Inter,system-ui,sans-serif}
    a{color:inherit;text-decoration:none}.container{width:min(1120px,calc(100% - 40px));margin:auto}
    header{background:#fff;border-bottom:1px solid var(--line)}.bar{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:12px}.brand img{width:54px;height:54px;object-fit:contain}.brand strong{font:800 1rem Poppins,sans-serif;color:var(--navy)}.brand span{display:block;color:#b38312;font-size:.7rem;font-weight:700;letter-spacing:1.6px;text-transform:uppercase}
    nav{display:flex;gap:22px;align-items:center;font-weight:600;font-size:.9rem}nav a:hover{color:#b38312}
    .hero{padding:64px 0 44px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}.eyebrow{color:var(--gold);font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:.72rem}.hero h1{font:800 clamp(2rem,5vw,3.6rem)/1.12 Poppins,sans-serif;margin:12px 0}.hero p{color:#cbd5e1;max-width:650px;margin:0}
    main{padding:44px 0 80px}.date-group{margin:0 0 44px}.date-heading{display:flex;align-items:center;gap:12px;margin:0 0 18px;color:var(--navy);font:700 1.25rem Poppins,sans-serif}.folder{font-size:1.2rem}.date-heading small{font:500 .85rem Inter,sans-serif;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 8px 24px #0a19310c}.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#e8edf5}.caption{padding:13px 15px}.caption p{margin:0 0 5px;font-weight:600;color:var(--navy)}.caption small{color:var(--muted)}
    .state{padding:35px 22px;border:1px dashed #cbd5e1;border-radius:16px;background:#fff;color:var(--muted);text-align:center}.state.error{color:#9b1c31;border-color:#e3aab3}
    footer{background:var(--navy);color:#cbd5e1;padding:25px 0;font-size:.86rem}.footer-row{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
    @media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:600px){.container{width:min(100% - 28px,1120px)}.bar{min-height:72px}.brand img{width:46px;height:46px}.brand strong{font-size:.88rem}nav{gap:12px;font-size:.82rem}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.hero{padding:48px 0 36px}}
  </style>
</head>
<body>
  <header>
    <div class="container bar">
      <a class="brand" href="index.html">
        <img src="images/badge.jpg" alt="">
        <div><strong>Sarang Adonai Rosete</strong><span>Foundation Uganda</span></div>
      </a>
      <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="admin/upload.html">Staff upload</a></nav>
    </div>
  </header>
  <section class="hero">
    <div class="container">
      <span class="eyebrow">Our moments</span>
      <h1>Life at Rosete</h1>
      <p>Photos from our classrooms, school community, and foundation work—organized by the date they were shared.</p>
    </div>
  </section>
  <main class="container">
    <div id="gallery-state" class="state" role="status">Loading gallery…</div>
    <div id="gallery-groups"></div>
  </main>
  <footer><div class="container footer-row"><span>© <span id="year"></span> Sarang Adonai Rosete Foundation Uganda</span><a href="index.html">Return to the foundation website</a></div></footer>
  <script>
    const API_BASE = "https://sarangadonai-api.sarangadonairosete.workers.dev";
    const state = document.getElementById("gallery-state");
    const groupsRoot = document.getElementById("gallery-groups");
    document.getElementById("year").textContent = new Date().getFullYear();

    function makeCard(item) {
      const article = document.createElement("article");
      article.className = "card";
      const image = document.createElement("img");
      image.src = item.public_url;
      image.alt = item.caption || item.filename || "Foundation gallery photo";
      image.loading = "lazy";
      image.decoding = "async";
      const details = document.createElement("div");
      details.className = "caption";
      const caption = document.createElement("p");
      caption.textContent = item.caption || item.filename || "Foundation photo";
      const filename = document.createElement("small");
      filename.textContent = item.filename || "";
      details.append(caption, filename);
      article.append(image, details);
      return article;
    }

    function renderGallery(groups) {
      groupsRoot.replaceChildren();
      for (const group of groups) {
        const section = document.createElement("section");
        section.className = "date-group";
        const heading = document.createElement("h2");
        heading.className = "date-heading";
        const icon = document.createElement("span");
        icon.className = "folder";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = "📁";
        const label = document.createElement("span");
        label.textContent = group.date;
        const count = document.createElement("small");
        count.textContent = `${group.items.length} ${group.items.length === 1 ? "photo" : "photos"}`;
        heading.append(icon, label, count);
        const grid = document.createElement("div");
        grid.className = "grid";
        group.items.forEach(item => grid.append(makeCard(item)));
        section.append(heading, grid);
        groupsRoot.append(section);
      }
      if (!groups.length) {
        state.textContent = "No photos have been added to the gallery yet.";
        state.hidden = false;
      } else {
        state.hidden = true;
      }
    }

    fetch(`${API_BASE}/gallery`, { headers: { Accept: "application/json" } })
      .then(response => {
        if (!response.ok) throw new Error("Gallery request failed");
        return response.json();
      })
      .then(data => renderGallery(data.groups || []))
      .catch(() => {
        state.classList.add("error");
        state.textContent = "The gallery could not be loaded right now. Please try again shortly.";
      });
  </script>
</body>
</html>
